# The Atlas backend for Triton as a wheel: a Python package plus a plugin .so, built against the stock Triton wheel.
# Layout follows triton-lang/triton-ext@268252b backend/AppleGPU/pyproject.toml (MIT).
[build-system]
# triton is here because CMake reads its headers and libtriton from the wheel.
requires = ["scikit-build-core>=0.11", "cmake>=3.22", "ninja", "triton==3.9.0"]
build-backend = "scikit_build_core.build"

[project]
name = "triton-atlas-backend"
version = "0.1.0"
description = "Atlas backend for Triton"
requires-python = ">=3.12"
license = "Apache-2.0"
# atlas-mlir is compiled into our library, and parts of our code derive from Triton and triton-ext.
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/*"]
# The plugin is built against this Triton's headers and LLVM, and Triton's loader refuses a plugin built for another
# version (triton v3.9.0 lib/Tools/PluginUtils.cpp:17-29, 60-64), so pip must install exactly this one.
dependencies = [
    "jsonschema>=4.23,<5",
    "triton==3.9.0",
]

[dependency-groups]
# Build tools, at the versions in uv.lock. The format and lint tools aren't here: pre-commit installs its own, at the
# versions in .pre-commit-config.yaml.
dev = [
    "cmake",
    "lit",
    "ninja",
    "pre-commit",
    "scikit-build-core>=0.11",
]

# How Triton finds us (triton v3.9.0 python/triton/backends/__init__.py:57-62).
[project.entry-points."triton.backends"]
atlas = "triton_atlas_backend"

# Style settings from triton v3.9.0 pyproject.toml.
[tool.yapf]
based_on_style = "pep8"
column_limit = 120
disable_split_list_with_comment = true
each_dict_entry_on_separate_line = false
split_before_named_assigns = false
split_complex_comprehension = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501", "E701", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# uv builds the plugin in .venv and build/plugin, as make does, so the two share one build. This keeps the LLVM and
# compiler that build/plugin's CMake cache recorded during make setup.
[tool.uv]
no-build-isolation-package = ["triton-atlas-backend"]

[tool.scikit-build]
build-dir = "build/plugin"
cmake.version = ">=3.22"
cmake.build-type = "Release"
# The plugin has no Python extension code, so one wheel fits every Python version we support.
wheel.py-api = "py3"
# Only our plugin: atlas-mlir's own install rules would add its tools.
install.components = ["plugin"]
wheel.exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.scikit-build.wheel.packages]
triton_atlas_backend = "python/triton_atlas_backend"
